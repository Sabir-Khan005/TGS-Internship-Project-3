<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - My Website</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <header>
        <div class="nav-container">
            <a href="Index.html" class="logo">MyBrand</a>
            <nav>
                <ul>
                    <li><a href="Index.html">Home</a></li>
                    <li><a href="Blog.html">Blog</a></li>
                    <li><a href="Contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <h1 class="page-title">Get In Touch</h1>
        <div class="contact-container">
            <div class="contact-form">
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" required placeholder="Enter Name">
                    </div>
                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" required placeholder="Enter Email">
                    </div>
                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" required placeholder="Write your message here">
                        </textarea>
                    </div>
                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>
            <div class="contaact-info">
                <h3>Contact Information</h3>
                <p>Feel free to reach out to us through any of the channels below out the form.
                </p>
                <p><strong>Email:</strong>sk7678135@gmail.com</p>
                <p><strong>Phone:</strong>0334-8851431</p>
                <p><strong>Address:</strong>Seru bada khel Bannu city, KPK</p>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 MyBrand. All rights reserved.</p>
    </footer>
</body>

</html>
